[package]
name = "agent-patch-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
agent-patch = { path = "../crates/agent-patch" }
libfuzzer-sys = "0.4"

[workspace]
members = ["."]

[[bin]]
name = "parse_patch"
path = "fuzz_targets/parse_patch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_policy"
path = "fuzz_targets/path_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "apply_update"
path = "fuzz_targets/apply_update.rs"
test = false
doc = false
bench = false
